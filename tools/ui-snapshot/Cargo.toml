[package]
name = "ui-snapshot"
version = "0.1.0"
edition = "2021"
publish = false

# Offscreen preview of the Freya NLE Slint windows. Renders with Slint's
# software renderer so it needs no window server or GPU, which makes it usable
# for design review and for checking a layout change without launching the app.
[dependencies]
slint = { version = "=1.17.1", default-features = false, features = ["std", "accessibility", "compat-1-2", "renderer-software", "software-renderer-systemfonts"] }

[build-dependencies]
slint-build = "=1.17.1"

[workspace]
