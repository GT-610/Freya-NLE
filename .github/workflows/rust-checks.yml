name: Rust checks

on:
  workflow_call:

permissions:
  contents: read

jobs:
  workspace:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    container:
      # Pinned to the digest the packaging jobs build and smoke-test against, so the
      # test environment cannot drift away from the release environment.
      image: docker.io/library/archlinux@sha256:d4594bb2300cba11f41c2f27923eb56f63d9988909c402f9c95517d1e362c899
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.99.1
        with:
          components: rustfmt, clippy
      - name: Install native dependencies
        run: |
          pacman-key --init
          pacman-key --populate archlinux
          pacman -Syu --noconfirm archlinux-keyring
          pacman -S --needed --noconfirm \
            alsa-lib base-devel clang python pkgconf ffmpeg mesa vulkan-devel \
            libx11 libxcursor libxi libxrandr libxkbcommon wayland wayland-protocols
      - name: Validate build helpers
        run: python -m unittest tests.test_build_version tests.test_logging_hygiene
      - name: Format, lint, and test workspace
        run: |
          cargo fmt --manifest-path rust/Cargo.toml --all -- --check
          cargo clippy --manifest-path rust/Cargo.toml --locked --workspace --all-targets --all-features -- -D warnings
          cargo test --manifest-path rust/Cargo.toml --locked --workspace --all-features
      - name: Test actual FFmpeg decoding, mixing, and encoding
        run: cargo test --manifest-path rust/Cargo.toml --locked -p freya-nle-media -p freya-nle-audio -- --ignored
