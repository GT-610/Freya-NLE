name: Release

# Publishing is a separate workflow from packaging so that a tag publishes
# exactly what the packaging workflow produced, without each platform job
# repeating the release decisions (prerelease, checksums, latest).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        # The publish gate below requires every artifact of the current set,
        # including the arm64 AppImage, so a tag whose source predates it
        # cannot be republished: its `package` run fails before `publish`.
        description: Tag to publish (must already exist and build every current release artifact)
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  resolve:
    name: Resolve the tag
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.read.outputs.version }}
      tag: ${{ steps.tag.outputs.tag }}
      prerelease: ${{ steps.tag.outputs.prerelease }}
      source_ref: ${{ steps.commit.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          # A tag build must read the tree the tag points at, not the branch tip.
          ref: ${{ format('refs/tags/{0}', inputs.tag || github.ref_name) }}
      - name: Record the checked-out commit
        id: commit
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Determine the tag
        id: tag
        run: |
          set -euo pipefail
          tag="${INPUT_TAG:-${GITHUB_REF_NAME}}"
          if [ -z "$tag" ]; then
            echo "Could not determine the tag to publish" >&2
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          # A candidate tag such as v0.8.0-rc.1 is a prerelease: it must not
          # displace the last stable release as the repository's latest.
          case "$tag" in
            *-*) echo "prerelease=true" >> "$GITHUB_OUTPUT" ;;
            *) echo "prerelease=false" >> "$GITHUB_OUTPUT" ;;
          esac
        env:
          INPUT_TAG: ${{ inputs.tag }}
      - name: Determine version
        id: read
        uses: ./.github/actions/resolve-version
        with:
          # The tag and the workspace version must agree; that is what makes the
          # artifact names trustworthy.
          tag: ${{ steps.tag.outputs.tag }}

  package:
    name: Package
    needs: [resolve]
    uses: ./.github/workflows/package.yml
    with:
      version: ${{ needs.resolve.outputs.version }}
      source_ref: ${{ needs.resolve.outputs.source_ref }}

  publish:
    name: Publish
    # `smoke-arch` is the only job that runs the Arch archive on Arch, and
    # `smoke-arm64` the only one that runs the arm64 image on arm64, so both are
    # gates like the other smoke test rather than advisory checks.
    needs: [resolve, package, smoke, smoke-arm64, smoke-arch]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.source_ref }}
      - name: Collect artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Check the artifact set
        run: |
          set -euo pipefail
          version="${{ needs.resolve.outputs.version }}"
          ls -l dist
          # One artifact per target, all carrying the same version. A missing
          # platform is a broken release, not a smaller one.
          for expected in \
            "Freya-NLE-$version-linux-x86_64.AppImage" \
            "Freya-NLE-$version-linux-arm64.AppImage" \
            "Freya-NLE-$version-linux-x86_64-archlinux.tar.zst" \
            "Freya-NLE-$version-macos-arm64.zip" \
            "Freya-NLE-$version-macos-x86_64.zip" \
            "Freya-NLE-$version-windows-x86_64.zip"; do
            if [ ! -f "dist/$expected" ]; then
              echo "Missing release artifact: $expected" >&2
              exit 1
            fi
          done
          # Nothing outside the scheme may reach a release page.
          for file in dist/*; do
            case "$(basename "$file")" in
              "Freya-NLE-$version-linux-x86_64.AppImage"|\
              "Freya-NLE-$version-linux-arm64.AppImage"|\
              "Freya-NLE-$version-linux-x86_64-archlinux.tar.zst"|\
              "Freya-NLE-$version-macos-arm64.zip"|\
              "Freya-NLE-$version-macos-x86_64.zip"|\
              "Freya-NLE-$version-windows-x86_64.zip") ;;
              *) echo "Unexpected file in the release: $file" >&2; exit 1 ;;
            esac
          done
      - name: Verify downloaded artifact contents
        env:
          VERSION: ${{ needs.resolve.outputs.version }}
          BUILT_COMMIT: ${{ needs.resolve.outputs.source_ref }}
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends zstd unzip
          work="$(mktemp -d)"
          trap 'rm -rf "$work"' EXIT
          verify="$GITHUB_WORKSPACE/scripts/verify-release-contents.py"
          # Only the image this runner can execute is unpacked here; the arm64
          # one is checked by `smoke-arm64`, which runs it for real. Extracting
          # the wrong architecture's image would mean running its runtime, and
          # the release notes are no place to find out that it will not start.
          image="$GITHUB_WORKSPACE/dist/Freya-NLE-$VERSION-linux-x86_64.AppImage"
          chmod +x "$image"
          (cd "$work" && "$image" --appimage-extract > /dev/null)
          python3 "$verify" "$work/squashfs-root/usr/bin" "$VERSION" "$BUILT_COMMIT" linux x86_64
          rm -rf "$work/squashfs-root"
          tar --zstd -xf "dist/Freya-NLE-$VERSION-linux-x86_64-archlinux.tar.zst" -C "$work"
          python3 "$verify" "$work" "$VERSION" "$BUILT_COMMIT" linux x86_64 --variant archlinux
          rm -rf "$work"
          mkdir -p "$work"
          for arch in arm64 x86_64; do
            unzip -q "dist/Freya-NLE-$VERSION-macos-$arch.zip" -d "$work"
            python3 "$verify" "$work/Freya NLE.app/Contents/Resources" "$VERSION" "$BUILT_COMMIT" macos "$arch"
            rm -rf "$work"
            mkdir -p "$work"
          done
          unzip -q "dist/Freya-NLE-$VERSION-windows-x86_64.zip" -d "$work"
          python3 "$verify" "$work" "$VERSION" "$BUILT_COMMIT" windows x86_64
      - name: Write checksums
        run: |
          set -euo pipefail
          cd dist
          # Every download can be verified, and the list is what the release
          # notes point at.
          sha256sum ./* > SHA256SUMS
          cat SHA256SUMS
      - name: Verify the tag still identifies the built commit
        env:
          RELEASE_TAG: ${{ needs.resolve.outputs.tag }}
          BUILT_COMMIT: ${{ needs.resolve.outputs.source_ref }}
        run: |
          set -euo pipefail
          git check-ref-format "refs/tags/$RELEASE_TAG"
          git fetch --no-tags --force origin "refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"
          actual="$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")"
          if [ "$actual" != "$BUILT_COMMIT" ]; then
            echo "Release tag changed after the build: expected $BUILT_COMMIT, got $actual" >&2
            exit 1
          fi
      # The tag already triggered this run, so the release is attached to it
      # rather than created here.
      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.resolve.outputs.tag }}
          name: Freya NLE ${{ needs.resolve.outputs.version }}
          generate_release_notes: true
          files: |
            dist/*
          prerelease: ${{ needs.resolve.outputs.prerelease == 'true' }}
          make_latest: ${{ needs.resolve.outputs.prerelease == 'true' && 'false' || 'true' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # A download is only worth publishing if the file starts. The packaging
  # workflow verified each artifact where it was built; this job re-checks what
  # is about to be uploaded, on a machine that did not build it.
  smoke:
    name: Smoke-test the artifacts
    needs: [resolve, package]
    runs-on: ubuntu-24.04
    steps:
      - name: Download the Linux artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Run the AppImage
        run: |
          set -euo pipefail
          version="${{ needs.resolve.outputs.version }}"
          image="dist/Freya-NLE-$version-linux-x86_64.AppImage"
          chmod +x "$image"
          # --appimage-extract-and-run is the FUSE-free path, which is also what
          # a containerised or WSL host needs.
          reported="$("$image" --appimage-extract-and-run --version)"
          echo "$reported"
          case "$reported" in
            *"$version"*) ;;
            *) echo "The AppImage reports the wrong version" >&2; exit 1 ;;
          esac
      - name: Unpack the Arch archive
        run: |
          set -euo pipefail
          version="${{ needs.resolve.outputs.version }}"
          archive="dist/Freya-NLE-$version-linux-x86_64-archlinux.tar.zst"
          mkdir -p unpacked
          tar --zstd -xf "$archive" -C unpacked
          # The executable bit is why this is a tar: a user must be able to run
          # it without a chmod step the documentation would have to explain.
          test -x unpacked/freya-nle
          ls unpacked

  # The arm64 image has to be started on arm64: the x86_64 runner above can
  # only prove that it does not crash the shell trying to execute it, and the
  # defect this catches -- an image labelled arm64 around an x86_64 payload --
  # is exactly the one that still looks fine from an x86_64 host.
  smoke-arm64:
    name: Smoke-test the arm64 AppImage on arm64
    needs: [resolve, package]
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
        with:
          # The contents check compares the bundled licences with the commit the
          # release claims to have built, so the tree has to be that commit.
          ref: ${{ needs.resolve.outputs.source_ref }}
      - name: Download the arm64 artifact
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Run the AppImage
        env:
          VERSION: ${{ needs.resolve.outputs.version }}
          BUILT_COMMIT: ${{ needs.resolve.outputs.source_ref }}
        run: |
          set -euo pipefail
          image="$GITHUB_WORKSPACE/dist/Freya-NLE-$VERSION-linux-arm64.AppImage"
          chmod +x "$image"
          # The label says arm64, so the payload has to say the same thing; a
          # mistyped ARCH would still name the file correctly.
          case "$(uname -m)" in
            aarch64|arm64) ;;
            *) echo "This runner is $(uname -m), not arm64" >&2; exit 1 ;;
          esac
          reported="$("$image" --appimage-extract-and-run --version)"
          echo "$reported"
          # Compare the version field, not a substring: a prefix match would
          # accept 0.7.0-rc.10 when the release says 0.7.0-rc.1.
          reported_version="$(printf '%s\n' "$reported" | awk '{print $NF}')"
          if [ "$reported_version" != "$VERSION" ]; then
            echo "The arm64 AppImage reports $reported_version, expected $VERSION" >&2
            exit 1
          fi
          # The ELF headers, not the labels: `uname -m` proves the runner and
          # `build-info.json` is metadata, so an x86_64 payload labelled arm64
          # would still start on a host that emulates it. The image file is the
          # runtime; the extracted binary is the application.
          work="$(mktemp -d)"
          trap 'rm -rf "$work"' EXIT
          (cd "$work" && "$image" --appimage-extract > /dev/null)
          for elf in "$image" "$work/squashfs-root/usr/bin/freya-nle"; do
            if ! readelf --file-header "$elf" | grep -q 'Machine:.*AArch64'; then
              echo "$elf is not an AArch64 binary" >&2
              exit 1
            fi
          done
          # The contents prove the payload is the build this release claims:
          # version, commit, architecture, and the bundled licences.
          python3 "$GITHUB_WORKSPACE/scripts/verify-release-contents.py" \
            "$work/squashfs-root/usr/bin" "$VERSION" "$BUILT_COMMIT" linux arm64

  smoke-arch:
    name: Smoke-test the Arch archive on Arch
    needs: [resolve, package]
    runs-on: ubuntu-24.04
    # The archive is linked against Arch's glibc and FFmpeg sonames, so it is run
    # inside the same pinned image it was built in. Running it on the runner's
    # Ubuntu would only prove that an Arch binary does not start on Ubuntu.
    container:
      image: docker.io/library/archlinux@sha256:d4594bb2300cba11f41c2f27923eb56f63d9988909c402f9c95517d1e362c899
    steps:
      - name: Install the runtime
        run: pacman -Syu --noconfirm --needed alsa-lib ffmpeg mesa zstd
      - name: Download the archive
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Run the packaged executable
        run: |
          set -euo pipefail
          version="${{ needs.resolve.outputs.version }}"
          archive="dist/Freya-NLE-$version-linux-x86_64-archlinux.tar.zst"
          mkdir -p unpacked
          tar --zstd -xf "$archive" -C unpacked
          test -x unpacked/freya-nle
          # `--version` exercises the dynamic linker and the bundled resources
          # before any window or GPU is touched.
          unpacked/freya-nle --version
