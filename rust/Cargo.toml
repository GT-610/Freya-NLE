[workspace]
resolver = "3"
members = ["freya-nle-app", "freya-nle-audio", "freya-nle-carla", "freya-nle-core", "freya-nle-export", "freya-nle-media", "freya-nle-preview", "freya-nle-render", "freya-nle"]

[workspace.package]
version = "0.8.2"
edition = "2024"
rust-version = "1.100.0"
publish = false

# `truce-rack-clap` 1.1.5 declares the buffer behind `value_to_text` as
# `[i8; ...]`, but `c_char` is `u8` on AArch64 Linux, so the Linux arm64 build
# does not compile. The vendored copy uses `c_char`.
#
# `truce-rack-vst3` 1.1.5 has the same assumption in its `char8` helpers and its
# platform-type strings. The vendored copy uses `c_char` there too.
#
# Drop these patches once an upstream release carries the fix (1.1.5 is the
# newest on crates.io).
[patch.crates-io]
truce-rack-clap = { path = "../vendor/truce-rack-clap" }
truce-rack-vst3 = { path = "../vendor/truce-rack-vst3" }

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
