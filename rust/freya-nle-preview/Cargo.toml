[package]
name = "freya-nle-preview"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
freya-nle-media = { path = "../freya-nle-media" }
freya-nle-render = { path = "../freya-nle-render" }
freya-nle-core = { path = "../freya-nle-core" }
serde_json = "1.0"
wgpu = { version = "29.0.1", default-features = false, features = ["std", "wgsl"] }

[dev-dependencies]
pollster = "0.4"

[target.'cfg(target_os = "macos")'.dev-dependencies]
wgpu = { version = "29.0.1", default-features = false, features = ["std", "wgsl", "metal"] }

[target.'cfg(target_os = "windows")'.dev-dependencies]
wgpu = { version = "29.0.1", default-features = false, features = ["std", "wgsl", "dx12"] }

[target.'cfg(target_os = "linux")'.dev-dependencies]
wgpu = { version = "29.0.1", default-features = false, features = ["std", "wgsl", "vulkan"] }

[lints.rust]
unsafe_code = "forbid"
